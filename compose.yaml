name: breach5-nitro-grid

services:
  game:
    build: .
    image: ${BREACH5_IMAGE:-breach5-nitro-grid:local}
    user: node
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    pids_limit: 64
    ulimits:
      nofile: {soft: 512, hard: 512}
      fsize: 1048576
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      MATCH_MIN_WAIT_MS: ${MATCH_MIN_WAIT_MS:-30000}
      MATCH_MAX_WAIT_MS: ${MATCH_MAX_WAIT_MS:-45000}
      GRID_COUNTDOWN_MS: ${GRID_COUNTDOWN_MS:-5000}
      ENCOUNTER_DURATION_MS: ${ENCOUNTER_DURATION_MS:-18000}
      MIN_ENCOUNTER_MS: ${MIN_ENCOUNTER_MS:-4000}
      RESULT_DURATION_MS: ${RESULT_DURATION_MS:-25000}
      MAX_PLAYERS: ${MAX_PLAYERS:-48}
      NITRO_GRID_SEED_SECRET: ${NITRO_GRID_SEED_SECRET:?generated by tools/booth.mjs}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:18090}
    ports:
      - "${BREACH5_BIND:-127.0.0.1}:${BREACH5_PORT:-18090}:3000"
    networks: [front]
    tmpfs:
      - "/tmp:size=8m,noexec,nosuid,nodev,mode=0700,uid=1000,gid=1000"
    mem_limit: 128m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 30

networks:
  front: {}
