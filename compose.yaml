name: breach5-booth-game

x-service-defaults: &service-defaults
  build: .
  image: ${BREACH5_IMAGE:-breach5-booth-game:local}
  user: node
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  pids_limit: 64
  ulimits:
    nofile: {soft: 512, hard: 512}
    fsize: 1048576

services:
  vulnerable-worker:
    <<: *service-defaults
    command: ["node", "engine/worker.mjs"]
    environment:
      HOST: 0.0.0.0
      PORT: 4300
      ENGINE_MODE: vulnerable
      WORKER_TOKEN: ${WORKER_TOKEN:?generated by tools/booth.mjs}
      BREACH5_PROOF: ${BREACH5_PROOF:?generated by tools/booth.mjs}
    networks: [vulnerable-backplane]
    tmpfs:
      - "/tmp:size=8m,noexec,nosuid,nodev,mode=0700,uid=1000,gid=1000"
    mem_limit: 96m
    cpus: 0.35
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4300/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 20

  vulnerable-gateway:
    <<: *service-defaults
    command: ["node", "engine/gateway.mjs"]
    depends_on:
      vulnerable-worker: {condition: service_healthy}
    environment:
      HOST: 0.0.0.0
      PORT: 4100
      ENGINE_MODE: vulnerable
      ENGINE_TOKEN: ${ENGINE_TOKEN:?generated by tools/booth.mjs}
      WORKER_TOKEN: ${WORKER_TOKEN:?generated by tools/booth.mjs}
      WORKER_HOST: vulnerable-worker
      WORKER_PORT: 4300
    networks: [engine, vulnerable-backplane]
    mem_limit: 80m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 20

  patched-worker:
    <<: *service-defaults
    command: ["node", "engine/worker.mjs"]
    environment:
      HOST: 0.0.0.0
      PORT: 4300
      ENGINE_MODE: patched
      WORKER_TOKEN: ${WORKER_TOKEN:?generated by tools/booth.mjs}
      BREACH5_PROOF: ${BREACH5_PROOF:?generated by tools/booth.mjs}
    networks: [patched-backplane]
    tmpfs:
      - "/tmp:size=8m,noexec,nosuid,nodev,mode=0700,uid=1000,gid=1000"
    mem_limit: 96m
    cpus: 0.35
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4300/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 20

  patched-gateway:
    <<: *service-defaults
    command: ["node", "engine/gateway.mjs"]
    depends_on:
      patched-worker: {condition: service_healthy}
    environment:
      HOST: 0.0.0.0
      PORT: 4200
      ENGINE_MODE: patched
      ENGINE_TOKEN: ${ENGINE_TOKEN:?generated by tools/booth.mjs}
      WORKER_TOKEN: ${WORKER_TOKEN:?generated by tools/booth.mjs}
      WORKER_HOST: patched-worker
      WORKER_PORT: 4300
    networks: [engine, patched-backplane]
    mem_limit: 80m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4200/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 20

  session-engine:
    build:
      context: .
      dockerfile: engine/session.Dockerfile
    image: ${SESSION_ENGINE_IMAGE:-breach5-session-engine:local}
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    pids_limit: 32
    ulimits:
      nofile: {soft: 256, hard: 256}
      fsize: 1048576
    environment:
      HOST: 0.0.0.0
      PORT: 4400
      SESSION_ENGINE_TOKEN: ${SESSION_ENGINE_TOKEN:?generated by tools/booth.mjs}
      SESSION_LAB_CLIENT_SECRET: ${SESSION_LAB_CLIENT_SECRET:?generated by tools/booth.mjs}
      SESSION_SIGNING_SECRET: ${SESSION_SIGNING_SECRET:?generated by tools/booth.mjs}
      SESSION_PROOF: ${SESSION_PROOF:?generated by tools/booth.mjs}
    networks: [session-lab]
    tmpfs:
      - "/tmp:size=8m,noexec,nosuid,nodev,mode=0700,uid=10001,gid=10001"
    mem_limit: 96m
    cpus: 0.35
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4400/healthz', timeout=1).read()"]
      interval: 3s
      timeout: 2s
      retries: 20

  game:
    <<: *service-defaults
    command: ["node", "src/server.mjs"]
    depends_on:
      vulnerable-gateway: {condition: service_healthy}
      patched-gateway: {condition: service_healthy}
      session-engine: {condition: service_healthy}
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      ENGINE_HOST: vulnerable-gateway
      VULNERABLE_ENGINE_PORT: 4100
      PATCHED_ENGINE_PORT: 4200
      PATCHED_ENGINE_HOST: patched-gateway
      ENGINE_TOKEN: ${ENGINE_TOKEN:?generated by tools/booth.mjs}
      SESSION_ENGINE_HOST: session-engine
      SESSION_ENGINE_PORT: 4400
      SESSION_ENGINE_TOKEN: ${SESSION_ENGINE_TOKEN:?generated by tools/booth.mjs}
      ROUND_DURATION_MS: ${ROUND_DURATION_MS:-180000}
      MAX_PLAYERS: ${MAX_PLAYERS:-16}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:18090}
    ports:
      - "${BREACH5_BIND:-127.0.0.1}:${BREACH5_PORT:-18090}:3000"
    networks: [front, engine, session-lab]
    mem_limit: 128m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 30

networks:
  front: {}
  engine: {internal: true}
  session-lab: {internal: true}
  vulnerable-backplane: {internal: true}
  patched-backplane: {internal: true}
